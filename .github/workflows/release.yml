name: Build and Release FloatingClock

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Standalone Windows Executable
        run: |
          pyinstaller --noconsole --onefile --name FloatingClock floating_clock.py --clean

      - name: Create Release Zip Package
        run: |
          Compress-Archive -Path dist\FloatingClock.exe, run_clock.bat, README.md -DestinationPath FloatingClock-Windows-x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FloatingClock.exe
            FloatingClock-Windows-x64.zip
          name: Release ${{ github.ref_name || inputs.tag_name }}
          body: |
            ## 🕒 Top Floating Multi-Clock ${{ github.ref_name || inputs.tag_name }}

            ### ✨ Các tính năng nổi bật:
            - 🕒 **Đồng hồ thời gian thực** (Realtime Clock): HUD Always-on-top, kéo thả tự do, mượt mà.
            - 🎯 **Đếm ngược tan làm** (Work Departure): Tự động đặt 17:45 (T2-T6) và 16:00 (T7).
            - 💸 **Bộ đếm tiền lương theo giây** (Salary Ticker): 2 dòng chi tiết Ngày & Tháng tích lũy.
            - 🌦️ **Dự báo thời tiết Realtime** (Open-Meteo): Cập nhật nhiệt độ & thời tiết các tỉnh thành VN (Phím `W`).
            - 🎧 **Âm thanh tập trung / White Noise** (Focus Sound): 6 thể loại âm thanh kích hoạt Deep Work (Phím `F9`).
            - 🔍 **Chế độ thu nhỏ tối giản** (Mini Mode - Phím `M`): Chỉ hiện số giờ, đổi màu linh hoạt theo thời gian.
            - 🎯 **Focus MIT Task** (Phím `T`) & 🤖 **AI động viên GenZ** (Gemini/Groq/OpenAI).
            - 💧 **Nhắc nhở uống nước**, ⏰ **Báo thức**, ⏱️ **Stopwatch**, 🍅 **Pomodoro**.

            ### 🚀 Cách sử dụng:
            1. Tải về file `FloatingClock.exe` hoặc giải nén `FloatingClock-Windows-x64.zip`.
            2. Nhấp đúp chuột vào `FloatingClock.exe` để chạy ngay không cần cài đặt Python.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
