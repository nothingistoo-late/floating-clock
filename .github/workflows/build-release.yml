name: 🚀 Build & Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: 📦 Build Executable & Setup Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # cần toàn bộ lịch sử + tag để viết changelog so với tag trước

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: 🌐 Download yt-dlp binary for audio streaming
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "app\bin"
          curl.exe -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -o "app\bin\yt-dlp.exe"

      - name: 📺 Download mpv player for YouTube hover video
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "app\bin"
          $headers = @{ "User-Agent" = "floating-clock-ci"; "Authorization" = "Bearer $env:GITHUB_TOKEN" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-x86_64-\d{8}-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "Khong tim thay ban mpv x86_64 trong release moi nhat" }
          curl.exe -L $asset.browser_download_url -o "mpv.7z"
          7z e "mpv.7z" "mpv.exe" "-oapp\bin" -y
          if (-not (Test-Path "app\bin\mpv.exe")) { throw "Giai nen mpv.exe that bai" }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔨 Build Standalone EXE with PyInstaller
        run: |
          pyinstaller FloatingClock.spec --clean --noconfirm

      - name: 🛠️ Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: 📦 Compile Windows Setup Installer (.exe)
        shell: powershell
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer\installer.iss

      - name: 🗜️ Create Portable ZIP Package
        shell: powershell
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          # mpv.exe để ngoài exe onefile (tránh giải nén ~30MB mỗi lần mở app) -> app\bin cạnh exe
          New-Item -ItemType Directory -Force -Path "dist\portable\app\bin" | Out-Null
          Copy-Item "dist\FloatingClock.exe" "dist\portable\"
          if (Test-Path "app\bin\mpv.exe") { Copy-Item "app\bin\mpv.exe" "dist\portable\app\bin\" }
          Compress-Archive -Path "dist\portable\*" -DestinationPath "dist\FloatingClock_Portable_$ver.zip" -Force

      - name: 📝 Generate release notes (nội dung tag + danh sách commit)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # checkout đôi khi lấy tag về dạng "nhẹ" → kéo lại đúng tag annotated để đọc nội dung tag
          git fetch --force --tags origin
          bash .github/scripts/release_notes.sh "${GITHUB_REF_NAME}" > release_notes.md
          cat release_notes.md

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: 🚀 Floating Clock Release ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/FloatingClock_Setup_*.exe
            dist/FloatingClock_Portable_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
