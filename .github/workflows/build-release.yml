name: 🚀 Build & Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: 📦 Build Executable & Setup Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: 🌐 Download yt-dlp binary for audio streaming
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "app\bin"
          curl.exe -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -o "app\bin\yt-dlp.exe"

      - name: 🔨 Build Standalone EXE with PyInstaller
        run: |
          pyinstaller FloatingClock.spec --clean --noconfirm

      - name: 🛠️ Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: 📦 Compile Windows Setup Installer (.exe)
        shell: powershell
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer\installer.iss

      - name: 🗜️ Create Portable ZIP Package
        shell: powershell
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          Compress-Archive -Path "dist\FloatingClock.exe" -DestinationPath "dist\FloatingClock_Portable_$ver.zip" -Force

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: 🚀 Floating Clock Release ${{ github.ref_name }}
          body: |
            ## 🚀 Floating Clock Release ${{ github.ref_name }} ( •̀ ω •́ )✧

            ### 📦 Download Packages:
            - **`FloatingClock_Setup_${{ github.ref_name }}.exe`** (Recommended): Full Windows Setup Wizard with Desktop & Start Menu shortcuts.
            - **`FloatingClock_Portable_${{ github.ref_name }}.zip`**: Standalone portable archive (extract and run).

            ---

            ### ✨ What's New & Key Features:
            - 🐱 **Pixel Mascot Desktop Pet:** Thú cưng ảo tự động chuyển trạng thái thông minh: cày cuốc (`work`) trong giờ làm, thư thái (`idle`) khi nghỉ trưa và nhảy nhót (`leaving`) khi sắp tan làm / cuối tuần.
            - 🎧 **Focus Music & Stream Player:** Tích hợp bộ âm thanh tập trung êm dịu, đài Lofi Live 24/7 và hỗ trợ dán link **YouTube / TikTok / SoundCloud / MP3** để phát ngầm tiết kiệm tài nguyên.
            - 💸 **Real-time Salary & Workday Progress:** Theo dõi tiền lương nhảy từng giây và thanh tiến độ ca làm việc trong ngày.
            - 🍅 **Productivity Suite:** Pomodoro Tracker, Bộ đếm ngược, Đồng hồ bấm giờ, Báo thức và Nhắc nhở uống nước.
            - 🌦️ **Weather Forecast & System Monitor:** Dự báo thời tiết Open-Meteo và theo dõi phần cứng CPU/RAM/Pin.
            - 🎛️ **Control Center & Hotkeys:** Bảng điều khiển trực quan, phím tắt nhanh `F8` (Xuyên thấu) và `F9` (Bật/Tắt âm thanh).

            ---

            ### 📖 Documentation:
            - [Main README](https://github.com/nothingistoo-late/floating-clock#readme)
          files: |
            dist/FloatingClock_Setup_*.exe
            dist/FloatingClock_Portable_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
